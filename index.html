<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nic &amp; Mag Studios | Coming Soon</title>
<meta name="description" content="Nic & Mag Studios is an online shop run by two sisters who love making little luxuries for your shelves, tables & walls. Coming soon." />
<meta property="og:title" content="Nic & Mag Studios" />
<meta property="og:description" content="Coming soon from Nic & Mag Studios." />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://nicandmagstudios.com/" />
<meta property="og:image" content="https://nicandmagstudios.com/logo-stacked.png" />
<meta name="theme-color" content="#FAF9F6" />
<link rel="icon" href="logo-stacked.png" />
<style>
  @font-face {
    font-family: 'Glacial Indifference';
    src: url('fonts/GlacialIndifference-Bold.woff2') format('woff2');
    font-weight: 700;
    font-style: normal;
    font-display: swap;
  }
  :root {
    --porcelain: #FAF9F6;
    --pink: #FAD9E7;
    --tomato: #D92D0B;
    --ink: #302326;
    --font-display: 'Glacial Indifference', Helvetica, Arial, sans-serif;
    --font-body: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--porcelain);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 17px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 24px;
  }
  main {
    text-align: center;
    max-width: 560px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
  }
  .logo {
    width: min(300px, 70vw);
    height: auto;
  }
  h1 {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 700;
    text-transform: uppercase;
    font-size: clamp(26px, 4vw, 40px);
    letter-spacing: 0.07em;
    line-height: 1.1;
    color: var(--tomato);
  }
  p { margin: 0; }
  .lead { max-width: 30em; }
  a { color: var(--tomato); }
  a:hover { color: var(--ink); }
  :focus-visible { outline: 2px solid var(--tomato); outline-offset: 4px; }
  .pill {
    display: inline-block;
    margin-top: 4px;
    padding: 14px 26px;
    border-radius: 999px;
    background: var(--tomato);
    color: var(--porcelain);
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    text-decoration: none;
  }
  .pill:hover { background: var(--ink); color: var(--porcelain); }
  footer { font-size: 14px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  @media (max-width: 480px) {
    .pill { font-size: 12px; letter-spacing: 0.08em; padding: 14px 18px; overflow-wrap: anywhere; }
  }
</style>
</head>
<body>
<main>
  <img class="logo" src="logo-stacked.png" alt="Nic &amp; Mag Studios" width="984" height="752" />
  <h1>Coming soon</h1>
  <p class="lead">Nic &amp; Mag Studios is an online shop run by two sisters who love making little luxuries for your shelves, tables &amp; walls.</p>
  <a class="pill" href="mailto:hello@nicandmagstudios.com">hello@nicandmagstudios.com</a>
  <footer>&copy; 2026 Nic &amp; Mag Studios LLC &middot; Oklahoma</footer>
</main>
</body>
</html>
